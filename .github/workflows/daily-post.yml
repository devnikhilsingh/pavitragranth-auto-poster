name: Daily Pavitra Granth Post

on:
  schedule:
    - cron: "30 2 * * *" # 8:00 AM IST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Create today's preview
        env:
          DRY_RUN: "true"
        run: python poster.py
      - name: Upload preview
        uses: actions/upload-artifact@v4
        with:
          name: pavitra-granth-preview
          path: |
            post-image.jpg
            caption.txt
